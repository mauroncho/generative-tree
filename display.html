<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lichtenberg // Salida CRT TV</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #050608;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: none;
      user-select: none;
    }
    body:hover {
      cursor: default;
    }
    canvas {
      display: block;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.95);
    }
    .tv-hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(6, 12, 22, 0.85);
      border: 1px solid rgba(80, 140, 240, 0.4);
      color: #b8d5ff;
      padding: 8px 16px;
      border-radius: 20px;
      font-family: monospace;
      font-size: 12px;
      letter-spacing: 0.5px;
      pointer-events: none;
      transition: opacity 1.2s ease;
      z-index: 999;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.8);
    }
    .tv-hint.fade-out {
      opacity: 0;
    }
  </style>
  <script src="js/p5.min.js"></script>
</head>
<body>
  <div id="tv-hint" class="tv-hint">📺 PANTALLA TV // [F] Pantalla Completa | Doble Click</div>
  <script src="js/config.js"></script>
  <script src="js/SpatialGrid.js"></script>
  <script src="js/BranchTip.js"></script>
  <script src="js/GrowthManager.js"></script>
  <script src="js/TVBridge.js"></script>
  <script src="js/display.js"></script>
</body>
</html>
